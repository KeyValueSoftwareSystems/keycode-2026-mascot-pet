<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Strict CSP. `img-src` needs the local scheme because the spritesheet is loaded from disk;
      `font-src` will carry the bundled emoji font from M5. Scripts are bundle-only: no inline
      script, no eval. `connect-src 'none'` is the belt-and-braces version of "the renderer never
      fetches anything" — all network access lives in main.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file: data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Argus</title>
    <link rel="stylesheet" href="./pet.fonts.css" />
    <link rel="stylesheet" href="./pet.generated.css" />
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <!--
      One window holds the sprite and the bubble. The bubble follows the pet for free, there is
      one set of bounds to place, and one alpha mask to hit-test against. The cost is a window
      much larger than the visible character, which is exactly what the mask handles.
    -->
    <div id="bubble" hidden>
      <span id="bubble-text"></span>
      <div id="bubble-actions">
        <span data-action="ok" role="button" aria-label="Done">✓</span>
        <span data-action="snooze" role="button" aria-label="Snooze"><span>z</span><span>Z</span><span>z</span></span>
      </div>
      <!-- Shown only for bubbles that wait to be clicked. Signage, not a button: the whole bubble
           is the hit target, so this must not swallow the pointer. -->
      <span class="dismiss-hint" aria-hidden="true">×</span>
    </div>
    <div id="sprite" class="pet-sprite" data-state="idle" data-nonce="0" data-facing="right"></div>
    <!-- Hover quick-actions. Main toggles visibility via frame.quickActions; renderer only paints. -->
    <div id="quick-menu" hidden data-actions="">
      <button type="button" data-action="zap" aria-label="Zap">⚡</button>
    </div>
    <!-- Pure-CSS sleep affordance. This is what lets `sleep` ship with no new art. -->
    <div id="zzz" aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
    <script type="module" src="./pet.ts"></script>
  </body>
</html>
