name: Release

# Tags only. Publishing on every push would announce a new version to every install several times a
# day; the per-push gate is ci.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# `write` because this job creates the Release the update announcement points at.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # Never fail-fast: if the Linux leg breaks, the macOS and Windows artifacts are still wanted.
      fail-fast: false
      matrix:
        include:
          # macOS 14 is an arm64 runner and builds both architectures.
          - os: macos-14
            script: package
            name: mac
          - os: windows-latest
            script: 'package:win-ci-only'
            name: win
          # Ubuntu 22.04 deliberately, not `latest`: the older glibc produces deb/rpm/AppImage
          # artifacts that install on a wider range of distributions. This is also the ONLY leg that
          # may build deb/rpm — see the note in docs/VERIFICATION.md about fpm on Apple Silicon.
          - os: ubuntu-22.04
            script: 'package:linux-ci-only'
            name: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generated artifacts are committed so a fresh clone builds without a generate step. This is the
      # check that stops them silently drifting from the generator.
      - name: Generated files are fresh
        # `shell: bash` is required, not stylistic: Windows runners default to PowerShell, where the
        # line-continuation backslashes below are read as literal arguments — `fatal: '\' is outside
        # repository`. It failed only on Windows, and only on the first run of this workflow.
        shell: bash
        run: |
          pnpm generate
          git diff --exit-code -- \
            apps/desktop/src/renderer/pet.generated.css \
            apps/desktop/src/pet-animations.generated.ts \
            apps/desktop/src/sprite/alpha-mask.generated.ts \
            apps/desktop/assets/pet/alpha-mask.json

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The first real evidence for Windows and Linux. The harness was built for this: `capturePage()`
      # needs no screen-recording permission, it runs in its own `--user-data-dir` so nothing on the
      # runner can collide with it, and its exit codes are distinct enough to diagnose from a log alone.
      # Linux has no display server on a runner, hence xvfb.
      #
      # `continue-on-error` on purpose, for now: these two platforms have never been run, so the first
      # failures are expected to be about the *harness* on a new OS rather than about the app. The
      # screenshots are the deliverable — look at them, then tighten this to a hard gate.
      # `--backdrop` on every platform now, and composite capture left ON. The harness grew a composite
      # backend per platform, and the two assertions that read a composite — A5 (the pet is visible over
      # the backdrop) and A7 (the ring around it is still the backdrop) — need no alpha channel. That is
      # what makes them the only pixel evidence available on Windows, where `capturePage()` stalls.
      - name: Smoke (macOS)
        if: matrix.name == 'mac'
        continue-on-error: true
        run: pnpm smoke --name ci-mac --backdrop

      # Two unknowns on this leg, both deliberate experiments rather than expected passes:
      # whether PowerShell's `CopyFromScreen` returns a real frame on a runner session at all, and
      # whether disabling GPU compositing lets `capturePage()` finish. The step cannot fail the build,
      # and the uploaded screenshots are the answer either way.
      - name: Smoke (Windows)
        if: matrix.name == 'win'
        continue-on-error: true
        env:
          KEYCODE_PET_DISABLE_GPU_COMPOSITING: '1'
        run: pnpm smoke --name ci-win --backdrop --capture-timeout 30000

      - name: Smoke (Linux, under xvfb)
        if: matrix.name == 'linux'
        continue-on-error: true
        run: |
          # `imagemagick` for the composite backend (`import -window root`), `x11-utils` so a failure can
          # say whether the display came up at all.
          sudo apt-get update && sudo apt-get install -y xvfb imagemagick x11-utils
          xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24+32' \
            pnpm smoke --name ci-linux --backdrop

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: docs/demo/ci-*.png
          if-no-files-found: warn

      # Runs the *same* script a developer runs locally. The first attempt invoked electron-builder
      # directly and omitted `--config electron-builder.config.cjs`, so every setting was ignored: the
      # output went to `dist/` instead of `release/`, and the artifacts were named after the workspace
      # package (`keycode-pet-workspace-1.7.0-arm64.dmg`). Calling the script removes the whole class of
      # CI-versus-local drift.
      #
      # Mac signing/notarization (optional). Set these repository secrets to produce a Gatekeeper-
      # clean DMG; leave them unset and the macOS leg stays ad-hoc signed (Windows/Linux unchanged):
      #   CSC_LINK              base64 of the Developer ID Application .p12
      #   CSC_KEY_PASSWORD      password for that .p12
      #   APPLE_API_KEY         raw contents of the App Store Connect .p8
      #   APPLE_API_KEY_ID      Key ID for that .p8
      #   APPLE_API_ISSUER      Issuer UUID from App Store Connect
      #   APPLE_TEAM_ID         10-character Team ID
      # Secrets are passed only on the mac leg — a Mac .p12 must never reach the Windows signer.
      # `secrets` cannot appear in `if:` (GitHub rejects the workflow). Gate on matrix only.
      #
      # Locally APPLE_API_KEY is a path to a .p8 file. In GitHub it must be the file *contents*
      # (raw PEM) or base64 of those contents — same idea as CSC_LINK. A path string or mangled
      # PEM produces notarytool's opaque `invalidAsn1` after signing succeeds.
      - name: Prepare Apple API key
        id: apple_api_key
        if: matrix.name == 'mac'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_API_KEY:-}" ]; then
            if [ -n "${CSC_LINK:-}" ]; then
              echo "::error::CSC_LINK is set but APPLE_API_KEY is empty — signing without notarization is not useful" >&2
              exit 1
            fi
            echo "APPLE_API_KEY not set; unsigned/ad-hoc mac build"
            exit 0
          fi
          if [ -z "${APPLE_API_KEY_ID:-}" ]; then
            echo "::error::APPLE_API_KEY_ID is required when APPLE_API_KEY is set" >&2
            exit 1
          fi

          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          raw=$(printf '%s' "$APPLE_API_KEY" | tr -d '\r')

          # Someone pasted a local path by mistake (works on a laptop, never on the runner).
          if [ -e "$raw" ]; then
            echo "::error::APPLE_API_KEY looks like a filesystem path. Store the .p8 contents or base64 of the file, not a path." >&2
            exit 1
          fi

          # Escaped newlines from a one-line paste: turn literal \n into real newlines.
          if printf '%s' "$raw" | grep -q '\\n'; then
            raw=$(printf '%s' "$raw" | awk '{gsub(/\\n/,"\n")}1')
          fi

          if printf '%s' "$raw" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$raw" > "$key_path"
          else
            # base64 of the .p8 (recommended for GitHub secrets — mirrors CSC_LINK).
            if ! printf '%s' "$raw" | base64 --decode > "$key_path" 2>/dev/null; then
              echo "::error::APPLE_API_KEY is neither PEM nor valid base64" >&2
              exit 1
            fi
          fi

          if ! grep -q 'BEGIN PRIVATE KEY' "$key_path"; then
            echo "::error::Decoded APPLE_API_KEY is not a PEM private key" >&2
            exit 1
          fi
          if ! openssl pkey -in "$key_path" -noout; then
            echo "::error::APPLE_API_KEY failed openssl pkey (notarytool would report invalidAsn1)" >&2
            exit 1
          fi

          # Absolute path for @electron/notarize (--key). Pass via output so Package does not rely
          # on GITHUB_ENV alone (and cannot accidentally keep the raw secret as APPLE_API_KEY).
          echo "key_path=${key_path}" >> "$GITHUB_OUTPUT"
          echo "Prepared AuthKey_${APPLE_API_KEY_ID}.p8 ($(wc -c < "$key_path" | tr -d ' ') bytes)"
          head -1 "$key_path"
          tail -1 "$key_path"

      - name: Package
        run: pnpm ${{ matrix.script }}
        env:
          # Without this, electron-builder tries to auto-discover a Developer ID on a runner that has
          # none and fails — except when CSC_LINK is set for the mac leg, where discovery must stay on.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.name == 'mac' && secrets.CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.name == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.name == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          # Must be a path to the .p8 from the prepare step — never the raw secret string.
          APPLE_API_KEY: ${{ steps.apple_api_key.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ matrix.name == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.name == 'mac' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ matrix.name == 'mac' && secrets.APPLE_TEAM_ID || '' }}

      - name: Artifact sizes
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }} artifacts"
            echo ''
            echo '```'
            ls -lh release/ | grep -Ev '^total|^d' | awk '{printf "%-10s %s\n", $5, $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: keycode-pet-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      # For an unsigned app this is the *only* integrity check a user has — there is no signature to
      # verify against, so a published digest is the difference between "trust the download" and
      # "check the download".
      # For an unsigned app the digest is the *only* integrity check a user has — there is no signature
      # for the OS to verify against. So this step must fail loudly rather than produce nothing:
      # `shasum` is a Perl script and is **absent from Git for Windows**, so the original
      # `shasum … 2>/dev/null | sed … || true` swallowed a "command not found", wrote an empty file, and
      # the release upload rejected it with `size must be greater than or equal to 1` — failing the
      # whole Windows leg, and with it the `announce` job, on a missing checksum nobody had noticed.
      - name: Checksums
        shell: bash
        run: |
          cd release
          # Unmatched globs vanish instead of being passed through as literal `*.dmg` arguments, which
          # is what made the old command exit non-zero on every platform.
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb *.rpm *.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no artifacts in release/ — packaging produced nothing to check" >&2
            exit 1
          fi

          out="SHA256SUMS-${{ matrix.name }}.txt"
          # `sha256sum` is coreutils: present on Linux and in Git for Windows, absent on macOS.
          # `shasum` is Perl: present on macOS and Linux, absent on Windows. Between them every runner
          # is covered, and neither being found is an error rather than an empty file.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${files[@]}" > "$out"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${files[@]}" > "$out"
          else
            echo "::error::neither sha256sum nor shasum is available on this runner" >&2
            exit 1
          fi

          # Strip the binary-mode marker some implementations prefix the filename with.
          sed -i.bak 's|^\([0-9a-f]\{64\}\) \*|\1  |' "$out" && rm -f "$out.bak"
          cat "$out"
          [ -s "$out" ] || { echo "::error::$out is empty" >&2; exit 1; }

      # Attach to the tag's Release. Install notes adapt when CSC_LINK is configured so a notarized
      # build does not tell users to fight Gatekeeper.
      - name: Write release install notes
        env:
          # Pass the secret itself; bash checks non-empty. Do not use `secrets` in `if:`.
          HAS_MAC_CERT: ${{ secrets.CSC_LINK }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          {
            echo '## Install'
            echo ''
            if [ -n "$HAS_MAC_CERT" ]; then
              echo '**macOS** — open the `.dmg` and drag Argos to Applications.'
            else
              echo '**macOS — this app is not signed by Apple, so macOS will refuse to open it the first time.**'
              echo 'Right-click the app in Applications and choose **Open**, then confirm. Or:'
              echo 'System Settings › Privacy & Security › **Open Anyway**. You only do this once.'
            fi
            echo ''
            echo '**Windows** — SmartScreen will warn about an unrecognised app: **More info** → **Run anyway**.'
            echo ''
            echo '**Linux** — the AppImage needs `chmod +x`; `.deb`/`.rpm` install normally.'
            echo ''
            echo '### Verify your download'
            echo ''
            if [ -n "$HAS_MAC_CERT" ]; then
              echo 'Compare against `SHA256SUMS-<platform>.txt` below:'
            else
              echo 'The app is unsigned, so a checksum is the only integrity check available. Compare against'
              echo '`SHA256SUMS-<platform>.txt` below:'
            fi
            echo ''
            echo '```'
            echo 'shasum -a 256 -c SHA256SUMS-mac.txt        # macOS / Linux'
            echo 'certutil -hashfile "<file>" SHA256          # Windows'
            echo '```'
            echo ''
            echo "Full instructions: [docs/INSTALL.md](https://github.com/${REPO}/blob/main/docs/INSTALL.md)"
          } > release-body.md

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          fail_on_unmatched_files: false
          # GitHub's own "What's Changed" from the commits, appended below the install steps.
          generate_release_notes: true
          body_path: release-body.md
          files: |
            release/SHA256SUMS-*.txt
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz

  # ---------------------------------------------------------------------------------------
  # Announce the release to every installed pet.
  # ---------------------------------------------------------------------------------------
  #
  # Runs only after every artifact is attached, because the announcement opens the download page
  # for this OS — a bubble pointing at a page with no files yet is worse than no announcement.
  # That ordering is the whole reason this is a separate job.
  #
  # CI writes `latestVersion` rather than a human, because the one time it was set by hand it declared
  # 0.6.0 against an app reporting 0.0.0 and handed every install an update bubble pointing at
  # example.invalid. Derived from the tag, it cannot disagree with what was built.
  announce:
    needs: build
    runs-on: ubuntu-22.04
    # Prereleases (`v1.7.1-rc.1`) build and publish artifacts but announce nothing: a release
    # candidate is for whoever asked for it, not for everyone's pet.
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: write
      # To dispatch the Pages deploy. See the note on the last step.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write the release block
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, collections
          tag = os.environ['TAG']
          version = tag[1:] if tag.startswith('v') else tag
          path = 'site/manifest.json'
          with open(path) as f:
              m = json.load(f, object_pairs_hook=collections.OrderedDict)
          m['release'] = collections.OrderedDict([
              ('latestVersion', version),
              # The Pages download page, not the GitHub tag listing: it picks the .dmg/.exe/AppImage
              # for the device that opened it. The user clicks Download to start that file.
              ('notesUrl', 'https://keyvaluesoftwaresystems.github.io/keycode-2026-mascot-pet/'),
              # `mandatory` pins a sticky, high-priority callout — the pet nags until clicked. Reserved
              # for emergencies and never set automatically.
              ('mandatory', False),
          ])
          with open(path, 'w') as f:
              json.dump(m, f, indent=2, ensure_ascii=False)
              f.write('\n')

          # Squirrel.Mac JSON feeds. Packaged Mac clients fetch these and apply the zip in place.
          repo = os.environ.get('GITHUB_REPOSITORY', 'KeyValueSoftwareSystems/keycode-2026-mascot-pet')
          tag = tag if tag.startswith('v') else f'v{version}'
          os.makedirs('site/updates', exist_ok=True)
          for arch in ('arm64', 'x64'):
              feed = collections.OrderedDict([
                  ('url', f'https://github.com/{repo}/releases/download/{tag}/Argos-{version}-mac-{arch}.zip'),
                  ('name', version),
              ])
              feed_path = f'site/updates/darwin-{arch}.json'
              with open(feed_path, 'w') as f:
                  json.dump(feed, f, indent=2, ensure_ascii=False)
                  f.write('\n')
          print('announcing', version)
          PY

      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The client's own parser, before this can reach anybody. An unknown top-level key would make
      # every install reject the whole file and go silent.
      - name: Validate
        run: pnpm build && node scripts/notify.mjs --list

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- site/manifest.json site/updates; then
            echo "release block unchanged; nothing to push"
            exit 0
          fi
          git add site/manifest.json site/updates
          git commit -m "release: announce ${{ github.ref_name }}"
          git push origin main

      # Pages must be dispatched, not left to the push above.
      #
      # GitHub deliberately does not run workflows for commits pushed with GITHUB_TOKEN — it is how
      # recursive CI is prevented. So the announce commit landed on main with the correct release block
      # and pages.yml simply never fired: the Release existed, the manifest in git was right, and every
      # client kept fetching the old file. Nothing failed, which is what made it worth a comment.
      - name: Deploy the announcement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
