name: Release

# Tags only. Publishing on every push would announce a new version to every install several times a
# day; the per-push gate is ci.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# `write` because this job creates the Release the update announcement points at.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # Never fail-fast: if the Linux leg breaks, the macOS and Windows artifacts are still wanted.
      fail-fast: false
      matrix:
        include:
          # macOS 14 is an arm64 runner and builds both architectures.
          - os: macos-14
            script: package
            name: mac
          - os: windows-latest
            script: 'package:win-ci-only'
            name: win
          # Ubuntu 22.04 deliberately, not `latest`: the older glibc produces deb/rpm/AppImage
          # artifacts that install on a wider range of distributions. This is also the ONLY leg that
          # may build deb/rpm — see the note in docs/VERIFICATION.md about fpm on Apple Silicon.
          - os: ubuntu-22.04
            script: 'package:linux-ci-only'
            name: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generated artifacts are committed so a fresh clone builds without a generate step. This is the
      # check that stops them silently drifting from the generator.
      - name: Generated files are fresh
        # `shell: bash` is required, not stylistic: Windows runners default to PowerShell, where the
        # line-continuation backslashes below are read as literal arguments — `fatal: '\' is outside
        # repository`. It failed only on Windows, and only on the first run of this workflow.
        shell: bash
        run: |
          pnpm generate
          git diff --exit-code -- \
            apps/desktop/src/renderer/pet.generated.css \
            apps/desktop/src/pet-animations.generated.ts \
            apps/desktop/src/sprite/alpha-mask.generated.ts \
            apps/desktop/assets/pet/alpha-mask.json

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The first real evidence for Windows and Linux. The harness was built for this: `capturePage()`
      # needs no screen-recording permission, it runs in its own `--user-data-dir` so nothing on the
      # runner can collide with it, and its exit codes are distinct enough to diagnose from a log alone.
      # Linux has no display server on a runner, hence xvfb.
      #
      # `continue-on-error` on purpose, for now: these two platforms have never been run, so the first
      # failures are expected to be about the *harness* on a new OS rather than about the app. The
      # screenshots are the deliverable — look at them, then tighten this to a hard gate.
      - name: Smoke (macOS, Windows)
        if: matrix.name != 'linux'
        continue-on-error: true
        run: pnpm smoke --name ci-${{ matrix.name }} --no-composite

      - name: Smoke (Linux, under xvfb)
        if: matrix.name == 'linux'
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run --auto-servernum pnpm smoke --name ci-linux --no-composite

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: docs/demo/ci-*.png
          if-no-files-found: warn

      # Runs the *same* script a developer runs locally. The first attempt invoked electron-builder
      # directly and omitted `--config electron-builder.config.cjs`, so every setting was ignored: the
      # output went to `dist/` instead of `release/`, and the artifacts were named after the workspace
      # package (`keycode-pet-workspace-1.7.0-arm64.dmg`). Calling the script removes the whole class of
      # CI-versus-local drift.
      - name: Package
        run: pnpm ${{ matrix.script }}
        env:
          # Without this electron-builder tries to auto-discover a Developer ID on a runner that has
          # none and fails the build — a CI-only failure that never reproduces locally.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Artifact sizes
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }} artifacts"
            echo ''
            echo '```'
            ls -lh release/ | grep -Ev '^total|^d' | awk '{printf "%-10s %s\n", $5, $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: keycode-pet-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      # Attach to the tag's Release. The app is UNSIGNED, so the body leads with the macOS approval
      # step — most people never open a docs file, and without it the first thing a new user sees is
      # "Apple could not verify this app".
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
          body: |
            ## Install

            **macOS — this app is not signed by Apple, so macOS will refuse to open it the first time.**
            Right-click the app in Applications and choose **Open**, then confirm. Or:
            System Settings › Privacy & Security › **Open Anyway**. You only do this once.

            **Windows** — SmartScreen will warn about an unrecognised app: **More info** → **Run anyway**.

            **Linux** — the AppImage needs `chmod +x`; `.deb`/`.rpm` install normally.

            Full instructions, including what each warning looks like: [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md)
